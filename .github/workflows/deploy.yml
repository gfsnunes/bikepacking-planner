# Test, build and deploy to Cloudflare Pages on every push to main (and on demand).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
# https://developers.cloudflare.com/pages/how-to/use-direct-upload-with-continuous-integration/
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  PROJECT: bikepacking-planner

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Secrets pasted via a terminal often carry a trailing newline, which makes the
      # Authorization header invalid. Tokens never contain whitespace, so strip it.
      # The diagnostics print lengths and character classes only, never the values.
      - name: Check Cloudflare secrets
        run: |
          token="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '[:space:]')"
          account="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '[:space:]')"
          echo "API token: ${#CF_TOKEN_RAW} chars as stored, ${#token} after trimming whitespace"
          echo "Account ID: ${#CF_ACCOUNT_RAW} chars as stored, ${#account} after trimming whitespace"
          [ -n "$token" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is missing or empty"; exit 1; }
          [ -n "$account" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is missing or empty"; exit 1; }
          case "$token" in
            *Bearer*|*curl*|*Authorization*|*http*) echo "::error::CLOUDFLARE_API_TOKEN looks like a whole command, not just the token"; exit 1 ;;
          esac
          printf '%s' "$token" | grep -qE '^[A-Za-z0-9_-]+$' || { echo "::error::CLOUDFLARE_API_TOKEN contains characters a Cloudflare token never has"; exit 1; }
          printf '%s' "$account" | grep -qE '^[0-9a-f]{32}$' || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character hex account ID"; exit 1; }
          echo "Secrets look well-formed"

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Create the Pages project on first run
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '[:space:]')"
          if npx wrangler pages project list | grep -qw "$PROJECT"; then
            echo "Project $PROJECT exists"
          else
            npx wrangler pages project create "$PROJECT" --production-branch=main
          fi

      - name: Deploy
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '[:space:]')"
          npx wrangler pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
